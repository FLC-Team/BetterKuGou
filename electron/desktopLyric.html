<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>桌面歌词</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    html, body { width: 100%; height: 100%; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif; background: transparent; color: #fff; overflow: hidden; -webkit-app-region: drag; }
    .lyric-container {
      --desktop-accent: #feca57;
      --desktop-text: #fff;
      --desktop-panel: rgba(24, 27, 34, 0.76);
      position: relative; width: 100%; height: 100%; padding: 42px 20px 22px;
      display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 5px;
      border: 1px solid transparent; border-radius: 12px; background: transparent;
      transition: background-color 180ms ease, border-color 180ms ease;
      cursor: move;
    }
    .theme-gradient { --desktop-accent: #b9b1ff; --desktop-panel: rgba(49, 40, 78, 0.78); }
    .theme-minimal { --desktop-accent: #fff; --desktop-panel: rgba(24, 27, 34, 0.66); }
    .lyric-container:hover:not(.locked), .lyric-container:focus-within:not(.locked) { background: var(--desktop-panel); border-color: rgba(255,255,255,0.16); }
    .song-info { flex: 0 0 auto; max-width: 100%; height: 18px; line-height: 18px; font-size: 12px; color: rgba(255,255,255,0.75); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 4px #000; transition: opacity 180ms ease, font-size 240ms ease; }
    .lyric-viewport { display: flex; flex: 0 0 auto; width: 100%; overflow: hidden; padding: 3px 0; }
    .current-lyric, .next-lyric { flex: 0 0 auto; width: max-content; margin: 0 auto; white-space: pre; line-height: 1.35; text-align: left; transform: translateX(0); }
    .current-lyric, .next-lyric { transition: font-size 240ms ease; }
    .current-lyric { font-size: 24px; font-weight: 650; color: var(--desktop-text); text-shadow: 0 2px 5px #000, 0 0 2px #000; }
    .current-lyric.active-line { color: var(--desktop-accent); }
    .next-lyric { min-height: 1.35em; font-size: 16px; color: rgba(255,255,255,0.86); text-shadow: 0 2px 4px #000, 0 0 2px #000; }
    .karaoke-char { display: inline-block; white-space: pre; color: var(--desktop-text); }
    .karaoke-char.sung { color: var(--desktop-accent); }
    .karaoke-char.singing { background: linear-gradient(90deg, var(--desktop-accent) var(--fill-progress, 0%), var(--desktop-text) var(--fill-progress, 0%)); background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: none; filter: drop-shadow(0 1px 2px #000); }
    [hidden] { display: none !important; }
    .song-info, .current-lyric, .next-lyric { font-family: var(--desktop-font, inherit); }
    .current-lyric, .next-lyric { -webkit-text-stroke: var(--desktop-stroke-width, 1px) rgba(0,0,0,0.9); paint-order: stroke fill; text-shadow: none; }
    .lyric-viewport { filter: var(--desktop-lyric-shadow, none); }
    .karaoke-char.singing { filter: none; }
    .next-lyric { color: var(--desktop-translation, rgba(255,255,255,0.86)); }
    .align-left .current-lyric, .align-left .next-lyric { margin-left: 0; margin-right: auto; }
    .align-right .current-lyric, .align-right .next-lyric { margin-left: auto; margin-right: 0; }
    .align-left .lyric-viewport { transform-origin: left center; }
    .align-right .lyric-viewport { transform-origin: right center; }
    .song-info { align-self: stretch; text-align: var(--desktop-alignment, center); }
    .song-info-only .song-info { height: auto; line-height: 1.35; font-size: 24px; font-weight: 650; color: var(--desktop-accent); -webkit-text-stroke: var(--desktop-stroke-width, 1px) rgba(0,0,0,0.9); paint-order: stroke fill; text-shadow: none; filter: var(--desktop-lyric-shadow, none); }
    .size-small.song-info-only .song-info { font-size: 20px; }
    .size-large.song-info-only .song-info { font-size: 32px; }
    .efficient-mode, .efficient-mode *, .efficient-mode *::before, .efficient-mode *::after { transition: none !important; animation: none !important; }
    .size-small .current-lyric { font-size: 20px; }
    .size-small .next-lyric { font-size: 14px; }
    .size-large .current-lyric { font-size: 32px; }
    .size-large .next-lyric { font-size: 20px; }
    .control-menu { position: absolute; top: 7px; left: 50%; transform: translateX(-50%); opacity: 0; pointer-events: none; transition: opacity 180ms ease; -webkit-app-region: no-drag; }
    .lyric-container:hover:not(.locked) .control-menu, .lyric-container:focus-within:not(.locked) .control-menu { opacity: 1; pointer-events: auto; }
    .controls { display: flex; align-items: center; gap: 5px; }
    .menu-btn { display: flex; align-items: center; justify-content: center; flex: 0 0 30px; width: 30px; height: 28px; border: 1px solid transparent; border-radius: 6px; background: rgba(255,255,255,0.10); color: #fff; font-family: inherit; font-size: 13px; line-height: 1; cursor: pointer; transition: background-color 180ms ease, scale 100ms ease, opacity 180ms ease; }
    .menu-btn:hover:not(:disabled) { background: rgba(255,255,255,0.23); }
    .menu-btn:active:not(:disabled) { scale: 0.88; }
    .menu-btn:focus-visible { outline: 2px solid var(--desktop-accent); outline-offset: 2px; }
    .menu-btn:disabled { opacity: 0.4; cursor: default; }
    .menu-btn[aria-pressed="true"] { border-color: var(--desktop-accent); color: var(--desktop-accent); }
    .menu-btn[aria-busy="true"] { opacity: 0.65; }
    .menu-btn svg { width: 15px; height: 15px; fill: currentColor; pointer-events: none; }
    .play-symbol { display: block; }
    .pause-symbol { display: none; }
    .playing .play-symbol { display: none; }
    .playing .pause-symbol { display: block; }
    .control-feedback { position: absolute; bottom: 5px; left: 10px; right: 10px; text-align: center; font-size: 11px; line-height: 14px; color: rgba(255,255,255,0.9); pointer-events: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .control-feedback[data-error="true"] { color: #ffd2cc; }
    .resize-handle { position: absolute; right: 4px; bottom: 4px; width: 18px; height: 18px; border: 0; border-radius: 3px; background: transparent; color: rgba(255,255,255,0.8); cursor: nwse-resize; opacity: 0; pointer-events: none; touch-action: none; -webkit-app-region: no-drag; transition: opacity 180ms ease; }
    .resize-handle svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.5; pointer-events: none; }
    .lyric-container:hover:not(.locked) .resize-handle, .lyric-container:focus-within:not(.locked) .resize-handle { opacity: 1; pointer-events: auto; }
    .resize-handle:focus-visible { outline: 2px solid var(--desktop-accent); }
    body.locked, .lyric-container.locked { cursor: default; -webkit-app-region: no-drag; }
    .lyric-container.locked { background: transparent; border-color: transparent; }
    .locked .control-menu, .locked .song-info, .locked .control-feedback, .locked .resize-handle { visibility: hidden; opacity: 0; pointer-events: none; }
    .locked.song-info-only .song-info { visibility: visible; opacity: 1; }
    body.locked .lyric-container { pointer-events: none; }
    .unlock-btn { position: fixed; top: 8px; right: 8px; width: 44px; height: 36px; z-index: 100; border: 1px solid rgba(255,255,255,0.35); border-radius: 8px; background: rgba(24,27,34,0.88); color: #fff; font: 12px 'Microsoft YaHei', sans-serif; cursor: pointer; pointer-events: auto; -webkit-app-region: no-drag; }
    .unlock-btn:focus-visible { outline: 2px solid #feca57; outline-offset: -3px; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; animation: none !important; }
      .menu-btn:active:not(:disabled) { scale: 1; }
    }
  </style>
</head>
<body data-bk-theme-root="desktop">
  <div class="lyric-container" id="lyricContainer">
    <div class="control-menu" id="controlMenu" role="toolbar" aria-label="桌面歌词控制">
      <div class="controls">
        <button type="button" class="menu-btn" id="previousBtn" title="上一首" aria-label="上一首"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 2h2v12H3zM13 2v12L5 8z"/></svg></button>
        <button type="button" class="menu-btn" id="playBtn" title="播放" aria-label="播放"><svg class="play-symbol" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2v12l10-6z"/></svg><svg class="pause-symbol" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 2h4v12H3zM9 2h4v12H9z"/></svg></button>
        <button type="button" class="menu-btn" id="nextBtn" title="下一首" aria-label="下一首"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M11 2h2v12h-2zM3 2l8 6-8 6z"/></svg></button>
        <button type="button" class="menu-btn" id="sizeBtn" title="字体大小" aria-label="字体大小">A</button>
        <button type="button" class="menu-btn" id="themeBtn" title="歌词样式" aria-label="歌词样式">◐</button>
        <button type="button" class="menu-btn" id="translationBtn" title="显示翻译" aria-label="显示翻译" aria-pressed="true">译</button>
        <button type="button" class="menu-btn" id="lockBtn" title="锁定并穿透鼠标；可从托盘或设置解锁" aria-label="锁定桌面歌词，可从托盘或设置解锁"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 7V5a4 4 0 0 1 8 0v2h1v8H3V7zm2 0h4V5a2 2 0 0 0-4 0z"/></svg></button>
        <button type="button" class="menu-btn" id="closeBtn" title="关闭桌面歌词" aria-label="关闭桌面歌词">✕</button>
      </div>
    </div>
    <div class="song-info" id="songInfo">暂无播放</div>
    <div class="lyric-viewport" id="currentViewport"><div class="current-lyric" id="currentLyric">请播放音乐以显示歌词</div></div>
    <div class="lyric-viewport" id="nextViewport"><div class="next-lyric" id="nextLyric"></div></div>
    <div class="control-feedback" id="controlFeedback" role="status" aria-live="polite"></div>
    <button type="button" class="resize-handle" id="resizeHandle" title="拖动调整窗口大小；方向键微调" aria-label="调整歌词窗口大小，使用方向键微调"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 13l9-9M9 13l4-4"/></svg></button>
  </div>
  <button type="button" class="unlock-btn" id="unlockBtn" style="position:fixed!important;top:8px!important;right:8px!important;left:auto!important;width:44px!important;height:36px!important;margin:0!important;transform:none!important;translate:none!important;scale:none!important;rotate:none!important" hidden title="解锁桌面歌词" aria-label="解锁桌面歌词">解锁</button>

  <script>
    const lyricAPI = window.desktopLyricAPI
    const subscriptions = []
    const container = document.getElementById('lyricContainer')
    const songInfo = document.getElementById('songInfo')
    const currentLyric = document.getElementById('currentLyric')
    const nextLyric = document.getElementById('nextLyric')
    const currentViewport = document.getElementById('currentViewport')
    const nextViewport = document.getElementById('nextViewport')
    const sizeBtn = document.getElementById('sizeBtn')
    const themeBtn = document.getElementById('themeBtn')
    const closeBtn = document.getElementById('closeBtn')
    const previousBtn = document.getElementById('previousBtn')
    const playBtn = document.getElementById('playBtn')
    const nextBtn = document.getElementById('nextBtn')
    const translationBtn = document.getElementById('translationBtn')
    const lockBtn = document.getElementById('lockBtn')
    const unlockBtn = document.getElementById('unlockBtn')
    const controlMenu = document.getElementById('controlMenu')
    const controlFeedback = document.getElementById('controlFeedback')
    const resizeHandle = document.getElementById('resizeHandle')
    const motionPreference = window.matchMedia?.('(prefers-reduced-motion: reduce)')
    const segmenter = typeof Intl.Segmenter === 'function' ? new Intl.Segmenter(undefined, { granularity: 'grapheme' }) : null
    const feedbackAnimations = new Map()
    const pendingButtons = new Set()
    let feedbackTimer = null
    let feedbackLeaving = false
    let updateRAFId = null
    let resizeObserver = null
    let disposed = false
    let currentSong = null
    let currentLyrics = []
    let currentTime = 0
    let currentDuration = 0
    let currentLyricIndex = -2
    let currentSize = 'medium'
    let currentTheme = 'classic'
    let showTranslation = true
    let isLocked = false
    let isPlaying = false
    let playbackAvailable = null
    let settingsRevision = 0
    let charEntries = []
    let layoutDirty = true
    let lineOverflow = 0
    let nextOverflow = 0
    let activeResize = null
    const maxInterpolationMs = 300
    let timeAnchor = 0
    let timeAnchorAt = 0
    let clockAdvancing = false
    let playbackRate = 1
    let timeDiscontinuity = true
    let renderTimer = null
    let lastRenderAt = -Infinity
    let runtimeHidden = false
    let coverRequestKey = ''
    let coverRequestVersion = 0
    let coverImage = null
    let coverShadowColor = ''
    let lyricShadowFilter = 'none'
    const displayOptions = {
      doubleLine: true, efficientMode: false, transitionEnabled: true, transitionBlur: true,
      hideTranslation: false, songInfoOnly: false, karaokeEnabled: true, hideUnlockButton: false,
      alignment: 'center', fontFamily: '', activeColor: '', textColor: '', translationColor: '', strokeWidth: 100,
      shadowEnabled: false, shadowColorMode: 'cover', shadowColor: '#000000', shadowDepth: 5,
      shadowDirection: 315, shadowOpacity: 50, shadowRadius: 10
    }

    function hasDecorativeMotion() { return !runtimeHidden && !displayOptions.efficientMode && !motionPreference?.matches }

    /** The viewport owns the shadow, so its temporary blur must retain that filter throughout promotion. */
    function promotionFilter(radius) {
      return `${lyricShadowFilter === 'none' ? '' : lyricShadowFilter + ' '}blur(${radius}px)`
    }

    /** Preserve the existing replacement feedback while cancelling obsolete animations. */
    function animateReplacement(element) {
      feedbackAnimations.get(element)?.cancel()
      feedbackAnimations.delete(element)
      const lyricMotion = element === currentLyric || element === nextLyric
      if (!element.textContent || !hasDecorativeMotion() || !element.animate || (lyricMotion && !displayOptions.transitionEnabled)) return
      const blur = lyricMotion && displayOptions.transitionBlur
      const animation = element.animate([{ opacity: 0, translate: '0 5px', ...(blur ? { filter: 'blur(4px)' } : {}) },
        { opacity: 1, translate: '0 0', ...(blur ? { filter: 'blur(0px)' } : {}) }], { duration: 220, easing: 'ease-out' })
      feedbackAnimations.set(element, animation)
      animation.onfinish = () => { if (feedbackAnimations.get(element) === animation) feedbackAnimations.delete(element) }
    }

    function animateText(element, text) {
      if (element.textContent === text) return
      element.textContent = text
      animateReplacement(element)
    }

    function showControlFeedback(text, error = false) {
      clearTimeout(feedbackTimer)
      feedbackLeaving = false
      feedbackAnimations.get(controlFeedback)?.cancel()
      feedbackAnimations.delete(controlFeedback)
      controlFeedback.dataset.error = String(error)
      animateText(controlFeedback, text)
      feedbackTimer = setTimeout(hideControlFeedback, error ? 3600 : 1800)
    }

    /** Leave before clearing the status; a newer result cancels this obsolete dismissal. */
    function hideControlFeedback() {
      if (!hasDecorativeMotion() || !controlFeedback.animate) { feedbackLeaving = false; animateText(controlFeedback, ''); return }
      feedbackLeaving = true
      feedbackAnimations.get(controlFeedback)?.cancel()
      const animation = controlFeedback.animate([{ opacity: 1, translate: '0 0' }, { opacity: 0, translate: '0 -4px' }], { duration: 160, easing: 'ease-in' })
      feedbackAnimations.set(controlFeedback, animation)
      animation.onfinish = () => {
        if (feedbackAnimations.get(controlFeedback) !== animation) return
        controlFeedback.textContent = ''
        feedbackLeaving = false
        feedbackAnimations.delete(controlFeedback)
      }
    }

    function stopFeedbackMotion() {
      feedbackAnimations.forEach(animation => animation.cancel())
      feedbackAnimations.clear()
      if (feedbackLeaving) { controlFeedback.textContent = ''; feedbackLeaving = false }
    }

    /** Interpolate only a short distance from an authoritative audio sample, never the playback state itself. */
    function visualPlaybackTime(now = performance.now()) {
      const elapsed = clockAdvancing ? Math.min(maxInterpolationMs, Math.max(0, now - timeAnchorAt)) * playbackRate : 0
      const time = timeAnchor + elapsed
      return currentDuration > 0 ? Math.min(time, currentDuration) : time
    }

    /** Consume IPC samples at display cadence; stop at the bounded horizon or immediately on pause/buffering. */
    function scheduleRender() {
      if (disposed || runtimeHidden || updateRAFId !== null || renderTimer !== null) return
      const remaining = 34 - (performance.now() - lastRenderAt)
      if (displayOptions.efficientMode && remaining > 0) {
        renderTimer = setTimeout(() => { renderTimer = null; scheduleRender() }, Math.ceil(remaining))
        return
      }
      updateRAFId = requestAnimationFrame(() => {
        updateRAFId = null
        if (disposed) return
        const now = performance.now()
        lastRenderAt = now
        currentTime = visualPlaybackTime(now)
        updateCurrentLyric()
        if (!displayOptions.songInfoOnly && clockAdvancing && now - timeAnchorAt < maxInterpolationMs &&
            !(currentDuration > 0 && currentTime >= currentDuration)) scheduleRender()
      })
    }

    /** A discontinuity invalidates pending line promotion as well as interpolation from the old position. */
    function resetVisualClock(time = currentTime) {
      clockAdvancing = false
      timeAnchor = currentTime = time
      timeAnchorAt = performance.now()
      timeDiscontinuity = true
      lastRenderAt = -Infinity
      clearTimeout(renderTimer)
      renderTimer = null
      stopLyricMotion()
    }

    function stopLyricMotion() {
      ;[currentLyric, nextLyric, currentViewport, nextViewport].forEach(element => {
        feedbackAnimations.get(element)?.cancel()
        feedbackAnimations.delete(element)
      })
    }

    /** The preview rises into the current row; horizontal playback transforms stay on the inner text. */
    function animateLinePromotion(preview) {
      if (!hasDecorativeMotion() || !displayOptions.transitionEnabled || !currentViewport.animate) return
      const current = currentViewport.getBoundingClientRect()
      const distance = preview.top + preview.height / 2 - current.top - current.height / 2
      const scale = Math.max(0.5, Math.min(1, preview.height / Math.max(1, current.height)))
      const animation = currentViewport.animate([
        { translate: `0 ${distance}px`, scale, opacity: 0.86, ...(displayOptions.transitionBlur ? { filter: promotionFilter(3) } : {}) },
        { translate: '0 0', scale: 1, opacity: 1, ...(displayOptions.transitionBlur ? { filter: promotionFilter(0) } : {}) }
      ], { duration: 280, easing: 'cubic-bezier(0.22, 1, 0.36, 1)' })
      feedbackAnimations.set(currentViewport, animation)
      animation.onfinish = () => { if (feedbackAnimations.get(currentViewport) === animation) feedbackAnimations.delete(currentViewport) }
    }

    function invalidateLayout() {
      layoutDirty = true
      scheduleRender()
    }

    function init() {
      updateSize()
      updateTheme()
      refreshControls()
      sizeBtn.addEventListener('click', cycleSize)
      themeBtn.addEventListener('click', cycleTheme)
      closeBtn.addEventListener('click', () => lyricAPI.close())
      previousBtn.addEventListener('click', () => sendPlayerControl(previousBtn, 'prev'))
      playBtn.addEventListener('click', () => sendPlayerControl(playBtn, 'toggle'))
      nextBtn.addEventListener('click', () => sendPlayerControl(nextBtn, 'next'))
      translationBtn.addEventListener('click', toggleTranslation)
      lockBtn.addEventListener('click', lockLyrics)
      unlockBtn.addEventListener('click', unlockLyrics)
      resizeHandle.addEventListener('pointerdown', beginResize)
      resizeHandle.addEventListener('pointermove', moveResize)
      resizeHandle.addEventListener('pointerup', endResize)
      resizeHandle.addEventListener('pointercancel', endResize)
      resizeHandle.addEventListener('lostpointercapture', endResize)
      resizeHandle.addEventListener('keydown', resizeWithKeyboard)
      subscriptions.push(lyricAPI.onSongUpdate(updateSongInfo))
      subscriptions.push(lyricAPI.onLyricUpdate(updateLyrics))
      subscriptions.push(lyricAPI.onTimeUpdate(updateCurrentTime))
      subscriptions.push(lyricAPI.onSettingsUpdate(updateSettings))
      if (lyricAPI.onError) subscriptions.push(lyricAPI.onError(message => showControlFeedback(typeof message === 'string' && message ? message : '操作失败，请重试', true)))
      if (lyricAPI.onPlaybackUpdate) subscriptions.push(lyricAPI.onPlaybackUpdate(updatePlayback))
      if (lyricAPI.onLockChanged) subscriptions.push(lyricAPI.onLockChanged(locked => { isLocked = Boolean(locked); updateLockState() }))
      if (lyricAPI.onRuntimeState) subscriptions.push(lyricAPI.onRuntimeState(updateRuntimeState))
      motionPreference?.addEventListener?.('change', stopFeedbackMotion)
      window.addEventListener('resize', invalidateLayout)
      window.addEventListener('blur', endResize)
      if (typeof ResizeObserver === 'function') {
        resizeObserver = new ResizeObserver(invalidateLayout)
        ;[currentViewport, nextViewport, currentLyric, nextLyric].forEach(element => resizeObserver.observe(element))
      }
      document.fonts?.ready.then(() => { if (!disposed) invalidateLayout() })
      window.addEventListener('beforeunload', dispose, { once: true })
    }

    function dispose() {
      disposed = true
      endResize()
      subscriptions.splice(0).forEach(unsubscribe => unsubscribe())
      if (updateRAFId !== null) cancelAnimationFrame(updateRAFId)
      updateRAFId = null
      clearTimeout(feedbackTimer)
      clearTimeout(renderTimer)
      renderTimer = null
      cancelCoverRequest()
      stopFeedbackMotion()
      resizeObserver?.disconnect()
      window.removeEventListener('resize', invalidateLayout)
      window.removeEventListener('blur', endResize)
      motionPreference?.removeEventListener?.('change', stopFeedbackMotion)
    }

    function updateLockState() {
      controlMenu.inert = isLocked
      resizeHandle.disabled = isLocked
      if (isLocked) endResize()
      container.classList.toggle('locked', isLocked)
      document.body.classList.toggle('locked', isLocked)
      unlockBtn.hidden = !isLocked || displayOptions.hideUnlockButton
      unlockBtn.style.setProperty('display', unlockBtn.hidden ? 'none' : 'block', 'important')
      unlockBtn.disabled = pendingButtons.has(unlockBtn)
    }

    /** Native visibility policy owns hiding; hidden windows stop rendering without discarding their latest sample. */
    function updateRuntimeState(state = {}) {
      runtimeHidden = state.hidden === true
      if (runtimeHidden) {
        if (updateRAFId !== null) cancelAnimationFrame(updateRAFId)
        updateRAFId = null
        clearTimeout(renderTimer)
        renderTimer = null
        stopFeedbackMotion()
      } else { lastRenderAt = -Infinity; scheduleRender() }
    }

    /** The main process measures screen DIP coordinates; transparent windows do not use native resize borders. */
    async function beginResize(event) {
      if (isLocked || disposed || activeResize || event.button !== 0) return
      event.preventDefault()
      const gesture = { pointerId: event.pointerId, started: false }
      activeResize = gesture
      resizeHandle.setPointerCapture(event.pointerId)
      try {
        const result = await lyricAPI.beginResize()
        if (activeResize !== gesture || disposed) return
        if (!result?.success) throw new Error(result?.error || '无法调整窗口')
        gesture.started = true
        lyricAPI.resize()
      } catch (error) {
        if (activeResize !== gesture || disposed) return
        endResize()
        console.warn('desktop-lyric', '调整窗口失败', error)
        showControlFeedback('无法调整窗口，请重试', true)
      }
    }

    function moveResize(event) {
      if (activeResize?.pointerId === event.pointerId && activeResize.started) lyricAPI.resize()
    }

    function endResize(event) {
      if (!activeResize || (event?.pointerId !== undefined && event.pointerId !== activeResize.pointerId)) return
      const pointerId = activeResize.pointerId
      activeResize = null
      if (resizeHandle.hasPointerCapture(pointerId)) resizeHandle.releasePointerCapture(pointerId)
      lyricAPI.endResize()
    }

    function resizeWithKeyboard(event) {
      const changes = { ArrowLeft: { width: -40, height: 0 }, ArrowRight: { width: 40, height: 0 }, ArrowUp: { width: 0, height: -20 }, ArrowDown: { width: 0, height: 20 } }
      if (!changes[event.key] || isLocked || activeResize) return
      event.preventDefault()
      return runAction(resizeHandle, () => lyricAPI.resizeBy(changes[event.key]))
    }

    /** Only the main process sends this already validated, window-scoped visual snapshot. Replace, never append. */
    function applyAppearance(appearance) {
      const root = document.documentElement
      const previous = root.dataset.appearanceTokens ? root.dataset.appearanceTokens.split(' ') : []
      previous.forEach(name => root.style.removeProperty(name))
      const tokens = appearance?.tokens || {}
      Object.entries(tokens).forEach(([name, value]) => root.style.setProperty(name, value))
      root.dataset.appearanceTokens = Object.keys(tokens).join(' ')
      let sheet = document.getElementById('desktop-appearance-css')
      if (!appearance?.css) { if (sheet) sheet.remove(); return }
      if (!sheet) { sheet = document.createElement('style'); sheet.id = 'desktop-appearance-css'; document.head.appendChild(sheet) }
      sheet.textContent = appearance.css
    }

    /** Consume validated display fields without allowing settings text to become CSS rules or markup. */
    function applyDisplayOptions(settings) {
      const previousOptions = JSON.stringify(displayOptions)
      const previousKaraoke = displayOptions.karaokeEnabled
      const previousInfoOnly = displayOptions.songInfoOnly
      for (const name of ['doubleLine', 'efficientMode', 'transitionEnabled', 'transitionBlur', 'hideTranslation', 'songInfoOnly', 'karaokeEnabled', 'hideUnlockButton', 'shadowEnabled']) {
        if (typeof settings[name] === 'boolean') displayOptions[name] = settings[name]
      }
      if (['left', 'center', 'right'].includes(settings.alignment)) displayOptions.alignment = settings.alignment
      if (['cover', 'custom'].includes(settings.shadowColorMode)) displayOptions.shadowColorMode = settings.shadowColorMode
      if (typeof settings.fontFamily === 'string') displayOptions.fontFamily = settings.fontFamily.trim().slice(0, 200)
      for (const name of ['activeColor', 'textColor', 'translationColor', 'shadowColor']) {
        if (typeof settings[name] === 'string' && (/^#[\da-f]{6}(?:[\da-f]{2})?$/i.test(settings[name]) || (name !== 'shadowColor' && settings[name] === ''))) displayOptions[name] = settings[name]
      }
      for (const [name, maximum] of [['strokeWidth', 200], ['shadowDepth', 100], ['shadowDirection', 360], ['shadowOpacity', 100], ['shadowRadius', 100]]) {
        if (Number.isFinite(settings[name])) displayOptions[name] = Math.max(0, Math.min(maximum, settings[name]))
      }
      container.classList.toggle('efficient-mode', displayOptions.efficientMode)
      container.classList.toggle('song-info-only', displayOptions.songInfoOnly)
      container.classList.remove('align-left', 'align-center', 'align-right')
      container.classList.add(`align-${displayOptions.alignment}`)
      container.style.setProperty('--desktop-alignment', displayOptions.alignment)
      container.style.setProperty('--desktop-stroke-width', `${displayOptions.strokeWidth / 100}px`)
      for (const [field, name] of [['activeColor', '--desktop-accent'], ['textColor', '--desktop-text'], ['translationColor', '--desktop-translation']]) {
        if (displayOptions[field]) container.style.setProperty(name, displayOptions[field])
        else container.style.removeProperty(name)
      }
      if (displayOptions.fontFamily) container.style.setProperty('--desktop-font', `"${displayOptions.fontFamily.replace(/[\\"\n\r\f]/g, character => /[\n\r\f]/.test(character) ? ' ' : '\\' + character)}"`)
      else container.style.removeProperty('--desktop-font')
      currentViewport.hidden = displayOptions.songInfoOnly
      nextViewport.hidden = displayOptions.songInfoOnly || !displayOptions.doubleLine
      if (previousKaraoke !== displayOptions.karaokeEnabled || previousInfoOnly !== displayOptions.songInfoOnly) currentLyricIndex = -2
      if (JSON.stringify(displayOptions) !== previousOptions) {
        stopFeedbackMotion()
        clearTimeout(renderTimer)
        renderTimer = null
        lastRenderAt = -Infinity
      }
      layoutDirty = true
      refreshCoverShadow()
      applyShadowStyle()
    }

    function cancelCoverRequest() {
      coverRequestVersion++
      if (coverImage) { coverImage.onload = null; coverImage.onerror = null; coverImage.src = ''; coverImage = null }
    }

    /** Read a tiny cover sample only when needed; obsolete images and inaccessible pixels retain the custom fallback. */
    function refreshCoverShadow() {
      const cover = displayOptions.shadowEnabled && displayOptions.shadowColorMode === 'cover' && typeof currentSong?.cover === 'string' ? currentSong.cover : ''
      if (cover === coverRequestKey) return
      cancelCoverRequest()
      coverRequestKey = cover
      coverShadowColor = ''
      applyShadowStyle()
      if (!cover || typeof Image !== 'function' || !/^(https?:|data:image\/|blob:|bk-cache:)/i.test(cover)) return
      const version = coverRequestVersion
      const image = new Image()
      coverImage = image
      image.crossOrigin = 'anonymous'
      image.onload = () => {
        if (disposed || version !== coverRequestVersion) return
        try {
          const canvas = document.createElement('canvas')
          canvas.width = canvas.height = 24
          const context = canvas.getContext('2d', { willReadFrequently: true })
          if (!context) return
          context.drawImage(image, 0, 0, 24, 24)
          const pixels = context.getImageData(0, 0, 24, 24).data
          const buckets = new Map()
          for (let offset = 0; offset < pixels.length; offset += 4) {
            if (pixels[offset + 3] < 128) continue
            const [red, green, blue] = pixels.slice(offset, offset + 3)
            const key = `${red >> 5},${green >> 5},${blue >> 5}`
            const bucket = buckets.get(key) || { count: 0, red: 0, green: 0, blue: 0 }
            bucket.count++; bucket.red += red; bucket.green += green; bucket.blue += blue
            buckets.set(key, bucket)
          }
          const dominant = [...buckets.values()].sort((left, right) => right.count - left.count)[0]
          if (dominant) coverShadowColor = '#' + ['red', 'green', 'blue'].map(name => Math.round(dominant[name] / dominant.count).toString(16).padStart(2, '0')).join('')
        } catch {
          // Cross-origin or unavailable cover pixels are optional; retain the configured fallback color.
        } finally {
          image.onload = null; image.onerror = null
          if (coverImage === image) coverImage = null
          if (!disposed && version === coverRequestVersion) applyShadowStyle()
        }
      }
      image.onerror = () => { if (coverImage === image) coverImage = null; image.onload = null; image.onerror = null }
      image.src = cover.replace('{size}', '100')
    }

    function applyShadowStyle() {
      if (!displayOptions.shadowEnabled) { lyricShadowFilter = 'none'; container.style.setProperty('--desktop-lyric-shadow', lyricShadowFilter); return }
      const color = displayOptions.shadowColorMode === 'cover' && coverShadowColor ? coverShadowColor : displayOptions.shadowColor
      const channels = [1, 3, 5].map(offset => parseInt(color.slice(offset, offset + 2), 16))
      const alpha = displayOptions.shadowOpacity / 100 * (color.length === 9 ? parseInt(color.slice(7, 9), 16) / 255 : 1)
      const angle = displayOptions.shadowDirection * Math.PI / 180
      const x = Math.round(Math.cos(angle) * displayOptions.shadowDepth * 100) / 100
      const y = Math.round(Math.sin(angle) * displayOptions.shadowDepth * 100) / 100
      lyricShadowFilter = `drop-shadow(${x}px ${y}px ${displayOptions.shadowRadius}px rgba(${channels.join(',')},${alpha}))`
      container.style.setProperty('--desktop-lyric-shadow', lyricShadowFilter)
    }

    // Settings broadcasts are authoritative; acknowledgements only fill in when no broadcast arrived.
    function updateSettings(settings = {}) {
      settingsRevision++
      if (Object.prototype.hasOwnProperty.call(settings, 'appearance')) applyAppearance(settings.appearance)
      if (['small', 'medium', 'large'].includes(settings.fontSize)) currentSize = settings.fontSize
      if (['classic', 'gradient', 'minimal'].includes(settings.theme)) currentTheme = settings.theme
      if (typeof settings.locked === 'boolean') isLocked = settings.locked
      if (typeof settings.showTranslation === 'boolean') showTranslation = settings.showTranslation
      applyDisplayOptions(settings)
      updateSize()
      updateTheme()
      updateLockState()
      refreshControls()
      updateCurrentLyric()
      scheduleRender()
    }

    function updateSize() {
      container.classList.remove('size-small', 'size-medium', 'size-large')
      container.classList.add(`size-${currentSize}`)
      sizeBtn.title = '字号：' + ({ small: '小', medium: '中', large: '大' })[currentSize]
      sizeBtn.setAttribute('aria-label', sizeBtn.title + '，点击切换')
      layoutDirty = true
    }

    function updateTheme() {
      container.classList.remove('theme-classic', 'theme-gradient', 'theme-minimal')
      container.classList.add(`theme-${currentTheme}`)
      themeBtn.title = '样式：' + ({ classic: '经典', gradient: '渐变', minimal: '简约' })[currentTheme]
      themeBtn.setAttribute('aria-label', themeBtn.title + '，点击切换')
      layoutDirty = true
    }

    /** Keep a failed action retryable, and never display an optimistic setting as saved. */
    async function runAction(button, operation, onSuccess, successText) {
      if (disposed || button.disabled || pendingButtons.has(button)) return
      pendingButtons.add(button)
      refreshControls()
      try {
        const result = await operation()
        if (disposed) return
        if (!result?.success) throw new Error(result?.error || '操作未完成')
        onSuccess?.()
        if (successText) showControlFeedback(typeof successText === 'function' ? successText() : successText)
      } catch (error) {
        if (!disposed) {
          console.warn('desktop-lyric', '控制操作失败', error)
          showControlFeedback('操作失败，请重试', true)
        }
      } finally {
        pendingButtons.delete(button)
        if (!disposed) refreshControls()
      }
    }

    function cycleSize() {
      const sizes = ['small', 'medium', 'large']
      const target = sizes[(sizes.indexOf(currentSize) + 1) % sizes.length]
      const revision = settingsRevision
      return runAction(sizeBtn, () => lyricAPI.changeSize(target), () => {
        if (revision === settingsRevision) { currentSize = target; updateSize(); updateCurrentLyric() }
      }, () => '字号：' + ({ small: '小', medium: '中', large: '大' })[currentSize])
    }

    function cycleTheme() {
      const themes = ['classic', 'gradient', 'minimal']
      const target = themes[(themes.indexOf(currentTheme) + 1) % themes.length]
      const revision = settingsRevision
      return runAction(themeBtn, () => lyricAPI.changeTheme(target), () => {
        if (revision === settingsRevision) { currentTheme = target; updateTheme(); updateCurrentLyric() }
      }, () => '样式：' + ({ classic: '经典', gradient: '渐变', minimal: '简约' })[currentTheme])
    }

    function toggleTranslation() {
      const target = !showTranslation
      const revision = settingsRevision
      return runAction(translationBtn, () => lyricAPI.setTranslation(target), () => {
        if (revision === settingsRevision) { showTranslation = target; updateCurrentLyric() }
      }, () => showTranslation ? '已显示翻译' : '已显示下一句')
    }

    function lockLyrics() {
      const revision = settingsRevision
      return runAction(lockBtn, () => lyricAPI.setLocked(true), () => {
        if (revision === settingsRevision) { isLocked = true; updateLockState() }
      })
    }

    function unlockLyrics() {
      if (!isLocked || displayOptions.hideUnlockButton) return
      const revision = settingsRevision
      return runAction(unlockBtn, () => lyricAPI.setLocked(false), () => {
        if (revision === settingsRevision) { isLocked = false; updateLockState() }
      })
    }

    function sendPlayerControl(button, action) {
      return runAction(button, () => lyricAPI.control(action))
    }

    function refreshControls() {
      const available = Boolean(currentSong) && playbackAvailable !== false
      const hasTranslation = currentLyrics.some(line => line.translation?.trim())
      const translationUnavailable = !hasTranslation || displayOptions.hideTranslation || !displayOptions.doubleLine || displayOptions.songInfoOnly
      ;[previousBtn, playBtn, nextBtn, sizeBtn, themeBtn, translationBtn, lockBtn, unlockBtn, resizeHandle].forEach(button => {
        const unavailable = ([previousBtn, playBtn, nextBtn].includes(button) && !available) || (button === translationBtn && translationUnavailable) || (button === resizeHandle && isLocked)
        button.disabled = unavailable || pendingButtons.has(button)
        button.setAttribute('aria-busy', String(pendingButtons.has(button)))
      })
      playBtn.classList.toggle('playing', isPlaying)
      playBtn.title = isPlaying ? '暂停' : '播放'
      playBtn.setAttribute('aria-label', playBtn.title)
      translationBtn.setAttribute('aria-pressed', String(showTranslation))
      translationBtn.title = translationUnavailable && hasTranslation ? '当前桌面显示模式已隐藏翻译，可在设置中调整' : hasTranslation ? (showTranslation ? '隐藏翻译，显示下一句' : '显示翻译') : '当前歌曲暂无翻译'
      translationBtn.setAttribute('aria-label', translationBtn.title)
    }

    function songKey(song) {
      return song ? (song.trackId || `${song.title || ''}\n${song.artist || ''}`) : null
    }

    /** A new track invalidates every old lyric and timing before its async lyrics arrive. */
    function updateSongInfo(song) {
      const nextSong = song && typeof song === 'object' ? song : null
      if (songKey(nextSong) !== songKey(currentSong)) {
        currentLyrics = []
        resetVisualClock(0)
        currentDuration = 0
        currentLyricIndex = -2
        charEntries = []
        isPlaying = false
        playbackAvailable = null
      }
      currentSong = nextSong
      refreshCoverShadow()
      animateText(songInfo, currentSong ? `${currentSong.title || '未知歌曲'} - ${currentSong.artist || '未知歌手'}` : '暂无播放')
      songInfo.title = songInfo.textContent
      refreshControls()
      updateCurrentLyric()
    }

    /** Accept plain strings only; lyric content never enters an HTML parser. */
    function updateLyrics(lyrics) {
      resetVisualClock()
      currentLyrics = Array.isArray(lyrics) ? lyrics.filter(line => line && Number.isFinite(line.time) && line.time >= 0).map(line => ({
        ...line,
        text: typeof line.text === 'string' ? line.text : '',
        translation: typeof line.translation === 'string' ? line.translation : '',
        romanization: typeof line.romanization === 'string' ? line.romanization : '',
        words: Array.isArray(line.words) ? line.words.filter(word => word && typeof (word.word ?? word.text) === 'string') : []
      })).sort((a, b) => a.time - b.time) : []
      currentLyricIndex = -2
      charEntries = []
      refreshControls()
      updateCurrentLyric()
    }

    function updateCurrentTime(time, meta = {}) {
      if (!Number.isFinite(time) || time < 0) return
      const now = performance.now()
      const visualTime = visualPlaybackTime(now)
      const difference = time - visualTime
      const advancing = meta.advancing === true && isPlaying
      const nextRate = Number.isFinite(meta.playbackRate) && meta.playbackRate > 0 ? meta.playbackRate : 1
      // Small delivery jitter must not briefly switch back to the previous line at a boundary.
      const correction = !meta.discontinuity && advancing && clockAdvancing && time > timeAnchor && difference < 0 && difference >= -50
        ? -difference / nextRate : 0
      const repeatedSample = !meta.discontinuity && advancing && clockAdvancing && time === timeAnchor && nextRate === playbackRate
      if (meta.discontinuity || (!repeatedSample && (difference < -100 || difference > 500))) resetVisualClock(time)
      timeAnchor = currentTime = time
      if (!repeatedSample) timeAnchorAt = now - correction
      clockAdvancing = advancing
      playbackRate = nextRate
      if (Number.isFinite(meta?.duration) && meta.duration >= 0) currentDuration = meta.duration
      scheduleRender()
    }

    function updatePlayback(state = {}) {
      if (typeof state.playing === 'boolean') isPlaying = state.playing
      if (typeof state.available === 'boolean') playbackAvailable = state.available
      if (Number.isFinite(state.duration) && state.duration >= 0) currentDuration = state.duration
      // Ordinary state broadcasts may carry an older cached time; only pause/replay replaces the audio anchor.
      if (!isPlaying || state.discontinuity) {
        resetVisualClock(Number.isFinite(state.time) && state.time >= 0 ? state.time : visualPlaybackTime())
      }
      refreshControls()
      scheduleRender()
    }

    function graphemes(text) {
      return segmenter ? Array.from(segmenter.segment(text), part => part.segment) : Array.from(text)
    }

    /** Rebuild by line identity, even when adjacent lines have exactly the same text. */
    function renderLine(line) {
      charEntries = []
      currentLyric.replaceChildren()
      currentLyric.classList.toggle('active-line', Boolean(line && (!line.isKrc || !displayOptions.karaokeEnabled)))
      if (displayOptions.karaokeEnabled && line?.isKrc && line.words.length) {
        const fragment = document.createDocumentFragment()
        line.words.forEach(word => {
          const letters = graphemes(word.word ?? word.text)
          const offset = Number.isFinite(word.startTime) ? Math.max(0, word.startTime) : 0
          const duration = Number.isFinite(word.duration) ? Math.max(0, word.duration) : Math.max(0, (word.endTime || 0) - offset)
          letters.forEach((letter, index) => {
            const element = document.createElement('span')
            element.className = 'karaoke-char'
            element.textContent = letter
            fragment.appendChild(element)
            charEntries.push({ element, start: line.time + offset + duration * index / letters.length, duration: duration / letters.length, progress: -1 })
          })
        })
        currentLyric.appendChild(fragment)
      } else {
        currentLyric.textContent = line ? (line.text || '♪') : (currentLyrics.length ? '♪ 前奏' : currentSong ? '暂无歌词' : '请播放音乐以显示歌词')
      }
      layoutDirty = true
    }

    /** Recalculate every grapheme from absolute time so seeks and paused first frames cannot retain stale state. */
    function updateKaraokeProgress() {
      charEntries.forEach(entry => {
        const progress = currentTime < entry.start ? 0 : entry.duration > 0 ? Math.min(1, (currentTime - entry.start) / entry.duration) : 1
        if (progress === entry.progress) return
        entry.element.className = progress >= 1 ? 'karaoke-char sung' : progress > 0 ? 'karaoke-char singing' : 'karaoke-char'
        entry.element.style.setProperty('--fill-progress', `${Math.round(progress * 1000) / 10}%`)
        entry.progress = progress
      })
    }

    function lineProgress(line, index) {
      if (!line) return currentLyrics[0]?.time > 0 ? Math.min(1, currentTime / currentLyrics[0].time) : 0
      const nextTime = currentLyrics[index + 1]?.time
      const durationEnd = Number.isFinite(line.duration) && line.duration > 0 ? line.time + line.duration : 0
      const wordEnd = line.words.reduce((end, word) => Math.max(end, line.time + (Number.isFinite(word.endTime) ? word.endTime : (word.startTime || 0) + (word.duration || 0))), 0)
      let end = durationEnd || wordEnd || nextTime || currentDuration
      if (nextTime && end > nextTime) end = nextTime
      return end > line.time ? Math.max(0, Math.min(1, (currentTime - line.time) / (end - line.time))) : 0
    }

    /** Measure only after content/font/viewport changes; horizontal position follows playback, not a second clock. */
    function updateLongLines(progress) {
      if (layoutDirty) {
        lineOverflow = Math.max(0, currentLyric.scrollWidth - currentViewport.clientWidth)
        nextOverflow = Math.max(0, nextLyric.scrollWidth - nextViewport.clientWidth)
        layoutDirty = false
      }
      const position = Math.max(0, Math.min(1, (progress - 0.12) / 0.76))
      currentLyric.style.transform = `translateX(${-Math.round(lineOverflow * position)}px)`
      // A translation belongs to this line; the upcoming lyric must remain readable from its beginning.
      nextLyric.style.transform = `translateX(${-Math.round(nextOverflow * (nextLyric.dataset.kind === 'translation' ? position : 0))}px)`
    }

    function updateCurrentLyric() {
      if (displayOptions.songInfoOnly) { timeDiscontinuity = false; return }
      let low = 0
      let high = currentLyrics.length
      while (low < high) {
        const middle = (low + high) >>> 1
        if (currentLyrics[middle].time <= currentTime) low = middle + 1
        else high = middle
      }
      const index = low - 1
      const line = currentLyrics[index]
      const lineChanged = index !== currentLyricIndex
      const sequential = lineChanged && !timeDiscontinuity && isPlaying && index === currentLyricIndex + 1
      const preview = sequential && ['next', 'intro'].includes(nextLyric.dataset.kind) && nextLyric.textContent === line?.text &&
        displayOptions.doubleLine && displayOptions.transitionEnabled && hasDecorativeMotion() && nextViewport.getBoundingClientRect ? nextViewport.getBoundingClientRect() : null
      if (lineChanged) {
        stopLyricMotion()
        currentLyricIndex = index
        renderLine(line)
        if (preview) animateLinePromotion(preview)
        else if (sequential) animateReplacement(currentLyric)
      }
      updateKaraokeProgress()
      const translation = showTranslation && !displayOptions.hideTranslation && line?.translation.trim() ? line.translation : ''
      const nextLine = currentLyrics[index + 1]
      const annotation = displayOptions.hideTranslation ? '' : [line?.romanization, translation].filter(Boolean).join(' · ')
      const secondary = annotation || nextLine?.text || ''
      const kind = annotation ? 'translation' : nextLine ? (index < 0 ? 'intro' : 'next') : 'empty'
      const identity = annotation ? `translation:${index}:${annotation}` : `line:${index + 1}`
      if (nextLyric.textContent !== secondary || nextLyric.dataset.kind !== kind || nextLyric.dataset.identity !== identity) {
        nextLyric.textContent = secondary
        if (!timeDiscontinuity) animateReplacement(nextLyric)
        nextLyric.dataset.kind = kind
        nextLyric.dataset.identity = identity
        layoutDirty = true
      }
      updateLongLines(lineProgress(line, index))
      timeDiscontinuity = false
    }

    document.addEventListener('DOMContentLoaded', init)
  </script>
</body>
</html>
