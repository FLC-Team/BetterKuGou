name: Build & Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
            arch: x64
            artifact: windows-x64
          - os: windows-latest
            target: win
            arch: ia32
            artifact: windows-ia32
          - os: windows-latest
            target: win
            arch: arm64
            artifact: windows-arm64
          - os: ubuntu-24.04
            target: linux
            arch: x64
            artifact: linux-x64
          - os: ubuntu-24.04-arm
            target: linux
            arch: arm64
            artifact: linux-arm64
          - os: macos-15-intel
            target: mac
            arch: x64
            artifact: macos-x64
          - os: macos-15
            target: mac
            arch: arm64
            artifact: macos-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/publish-release.cjs --check-tag "$GITHUB_REF_NAME"
        shell: bash
      - run: npm ci
      - name: Install Linux native plugin window dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxext-dev libxcb1-dev libxkbcommon-x11-dev
      - name: Install Linux ARM64 packaging tools
        if: matrix.artifact == 'linux-arm64'
        run: |
          sudo apt-get install -y ruby ruby-dev build-essential rpm squashfs-tools
          sudo gem install fpm --version 1.17.0 --no-document
          fpm --version
      - run: npm run check
      - run: npm run build:audio-effects
      - run: npm test
      - name: Package one architecture
        run: npm run "dist:$BK_TARGET" -- "--$BK_ARCH" --publish never
        shell: bash
        env:
          BK_TARGET: ${{ matrix.target }}
          BK_ARCH: ${{ matrix.arch }}
      - name: Verify native installer protocol, UI and file transactions
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $nsisCache = Join-Path $PWD '.cache/nsis/3.12'
          $bundle = (Get-Content -LiteralPath (Join-Path $nsisCache 'verified-bundle'))[1]
          $env:BK_NSIS_COMPILER = Join-Path $nsisCache "$bundle/nsis-bundle/windows/Bin/makensis.exe"
          node --test tests/installer-install-mode.test.cjs tests/installer-completion.test.cjs tests/installer-nsis.test.cjs tests/installer-ui.test.cjs tests/installer-windows-files.test.cjs
        env:
          BK_REQUIRE_NSIS_TESTS: '1'
          BK_REQUIRE_INSTALLER_FILES_TESTS: '1'
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BetterKuGou-${{ matrix.artifact }}
          overwrite: true
          path: |
            release/BetterKuGou-v*-win-${{ matrix.arch }}-setup.exe
            release/BetterKuGou-v*-linux-${{ matrix.arch }}.AppImage
            release/BetterKuGou-v*-linux-${{ matrix.arch }}.deb
            release/BetterKuGou-v*-linux-${{ matrix.arch }}.rpm
            release/BetterKuGou-v*-mac-${{ matrix.arch }}.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: publish-${{ github.ref }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          pattern: BetterKuGou-*
          path: release-assets
      - name: Publish complete release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/publish-release.cjs --publish "$GITHUB_REF_NAME" release-assets
