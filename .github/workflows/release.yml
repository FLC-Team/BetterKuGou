name: Build & Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            npm run dist:win
          elif [ "${{ runner.os }}" = "Linux" ]; then
            npm run dist:linux
          elif [ "${{ runner.os }}" = "macOS" ]; then
            npm run dist:mac
          fi
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload Release Assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/BetterKuGou-*-setup.exe
            release/BetterKuGou-*.AppImage
            release/BetterKuGou-*.deb
            release/BetterKuGou-*.rpm
            release/BetterKuGou-*.dmg
          body_path: updata_log.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload Build Artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: BetterKuGou-${{ matrix.os }}-${{ github.run_number }}
          path: |
            release/BetterKuGou-*-setup.exe
            release/BetterKuGou-*.AppImage
            release/BetterKuGou-*.deb
            release/BetterKuGou-*.rpm
            release/BetterKuGou-*.dmg
          if-no-files-found: warn
